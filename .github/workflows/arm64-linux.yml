name: ARM64 Linux platform checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: arm64-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      RX_CPM: ${{ github.workspace }}/cpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native compiler and runtime headers
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y clang lld g++ pkg-config libsdl2-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev
      - name: Vulkan headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b
          path: cpm/vulkanheaders/pinned
          persist-credentials: false
      - name: SPIR-V headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 04f10f650d514df88b76d25e83db360142c7b174
          path: cpm/spirv-headers/pinned
          persist-credentials: false
      - name: Vulkan Memory Allocator headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator
          ref: 1d8f600fd424278486eade7ed3e877c99f0846b1
          path: cpm/vulkanmemoryallocator/pinned
          persist-credentials: false
      - name: Nonlocal jumps and real Linux faults
        run: python3 tests/test_arm64_platform.py
      - name: Host-pointer and DMA-buffer memory startup
        run: python3 tests/test_dma_memory_init.py
      - name: Guest memory copies and fence publication
        run: python3 tests/test_guest_copy.py
      - name: Compile the complete host runtime without a game
        shell: bash
        run: python3 nx2/check_platform.py 2>&1 | tee runtime-check.log
      - name: Compile and link the Vulkan renderer without a game
        env:
          RX_VK_ONLY: '1'
        shell: bash
        run: python3 nx2/build.py --standalone --jobs 2 2>&1 | tee renderer-check.log
      - name: Publish compiler diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_NAME: Compiler diagnostics (${{ matrix.runner }})
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          logs = []
          for name in ('runtime-check.log', 'renderer-check.log'):
              path = Path(name)
              if path.exists():
                  logs.append(name + '\n' + path.read_text(errors='replace')[-24000:])
          payload = {'name': os.environ['CHECK_NAME'], 'head_sha': os.environ['CHECK_SHA'],
                     'status': 'completed', 'conclusion': 'failure',
                     'output': {'title': 'Native compiler diagnostics',
                                'summary': 'Game-free runtime/renderer compiler output.',
                                'text': '\n\n'.join(logs) or 'Failed before compilation; see the workflow log.'}}
          Path('compiler-diagnostics.json').write_text(json.dumps(payload))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input compiler-diagnostics.json > /dev/null
      - name: Record what was checked
        if: always()
        run: |
          if [ -f work/platform-check/result.json ]; then
            cat work/platform-check/result.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/sa/build/hookshot_vk.so ]; then
            file work/sa/build/hookshot_vk.so >> "$GITHUB_STEP_SUMMARY"
          fi
